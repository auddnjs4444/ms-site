<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료실 — MEDISIGN</title>
<meta name="description" content="메디사인이 만든 의료 의사소통 도구와 프로젝트.">
<meta name="theme-color" content="#F2F1EB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23188144'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='36' font-weight='800' fill='%23F6F6F4' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 홈(index.html)과 같은 색·글꼴 토큰 */
:root{
  --paper:#F2F1EB; --surface:#F6F6F4; --ink:#121210; --ink-soft:#3A3A36; --muted:#706E63;
  --line:rgba(18,18,16,.14); --accent:#188144; --accent-deep:#0F6B37; --on-dark:#F6F6F4;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;
  line-height:1.75;letter-spacing:-.011em;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:fixed;left:1rem;top:-4rem;z-index:200;background:var(--ink);color:var(--on-dark);
  padding:.7rem 1.2rem;font-weight:700;text-decoration:none;transition:top .2s}
.skip:focus{top:1rem}
[hidden]{display:none!important}

.wrap{width:min(1080px,92vw);margin-inline:auto;padding:clamp(2rem,6vw,3.6rem) 0 4.5rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:clamp(2rem,5vw,3rem)}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.brand img{display:block;height:40px;width:auto;filter:invert(1)}
.brand span{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.back{font-size:.86rem;font-weight:650;color:var(--accent-deep);text-underline-offset:4px}

.cat{font-size:.8rem;font-weight:650;letter-spacing:.02em;color:var(--accent-deep)}
h1{margin-top:.5rem;font-size:clamp(1.7rem,4.4vw,2.6rem);letter-spacing:-.035em;line-height:1.18;font-weight:600}
.summary{margin-top:.9rem;font-size:clamp(1rem,1.6vw,1.12rem);color:var(--ink-soft)}
.ver{margin-top:.6rem;font-size:.82rem;font-weight:600;color:var(--ink-soft)}

.detail{margin-top:clamp(2rem,4vw,2.8rem);display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.6rem,4vw,3.2rem);align-items:start}
@media (max-width:860px){ .detail{grid-template-columns:1fr} }

/* 사진 갤러리 */
/* 틀 높이는 사진 비율을 따라갑니다 (정사각형 도구 사진 · 가로로 긴 사이트 화면 모두 여백 없이) */
.frame{background:#EDEFEB;border:1px solid var(--line);overflow:hidden}
.frame img{width:100%;height:auto;display:block}
.frame .ph{aspect-ratio:1/1;height:auto}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:#E4E3DD;color:var(--ink-soft);font-size:.9rem;font-weight:600}
.thumbs{margin-top:.7rem;display:flex;gap:.5rem;flex-wrap:wrap;list-style:none}
.thumb{width:76px;background:none;border:1px solid var(--line);padding:0;cursor:pointer;font-family:inherit}
.thumb .t-img{aspect-ratio:1;overflow:hidden;background:#E4E3DD;display:flex;align-items:center;justify-content:center;
  font-size:.62rem;color:var(--ink-soft)}
.thumb .t-img img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .t-label{display:block;font-size:.72rem;font-weight:600;color:var(--ink-soft);padding:.25rem 0}
.thumb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* 버튼 */
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;font-family:inherit;font-size:.93rem;font-weight:700;
  text-decoration:none;background:var(--ink);color:var(--on-dark);border:1px solid var(--ink);
  padding:.8rem 1.25rem;cursor:pointer}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn.big{font-size:1.05rem;padding:1.05rem 1.6rem}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-note{margin-top:.5rem;font-size:.78rem;color:var(--muted)}

/* 본문 블록 */
.block{margin-top:2.4rem;border-top:1px solid var(--line);padding-top:1.4rem}
.block:first-child{margin-top:0}
.block h2{font-size:1.05rem;font-weight:650;letter-spacing:-.02em}
.usage{margin-top:1rem;display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media (max-width:520px){ .usage{grid-template-columns:1fr} }
.usage h3{font-size:.86rem;font-weight:700;color:var(--accent-deep)}
.usage ol{margin-top:.5rem;padding-left:1.25rem;font-size:.93rem;color:var(--ink-soft);line-height:1.75}
.usage li{margin-top:.25rem}
.empty{margin-top:.6rem;font-size:.9rem;color:var(--ink-soft)}
.tbl-wrap{margin-top:.9rem;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:420px}
th,td{text-align:left;vertical-align:top;border-top:1px solid var(--line);padding:.6rem .5rem}
thead th{border-top:0;font-size:.78rem;font-weight:700;color:var(--ink-soft)}
td{color:var(--ink-soft)}
td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
dl.facts{margin-top:.8rem;display:grid;grid-template-columns:max-content 1fr;gap:.5rem 1.2rem;font-size:.93rem}
dl.facts dt{font-weight:650}
dl.facts dd{color:var(--ink-soft)}
ul.results{margin-top:.8rem;padding-left:1.15rem;font-size:.95rem;color:var(--ink-soft);line-height:1.8}
.fine{font-size:.86rem;color:var(--ink-soft);line-height:1.75}
.fine p+p{margin-top:.5rem}
.fine b{color:var(--ink);font-weight:650}
.fine a{color:var(--accent-deep);text-underline-offset:3px}

/* 상세 소개와 사진 (홈 타임라인 사진과 같은 모양) */
.intro{margin-top:.8rem;font-size:.95rem;color:var(--ink-soft);line-height:1.85;white-space:pre-line}
.fig{margin-top:1.3rem;max-width:360px}
.fig a{display:block;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.fig img{width:100%;height:auto;display:block;transition:transform .5s ease}
.fig a:hover img{transform:scale(1.03)}
.fig figcaption{margin-top:.5rem;font-size:.8rem;font-weight:600;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){ .fig img{transition:none} }
.notfound{padding:3rem 0}
footer{margin-top:3.5rem;border-top:1px solid var(--line);padding-top:1.4rem;
  font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 바로가기</a>

<div class="wrap">
  <div class="top">
    <a class="brand" href="index.html">
      <img src="assets/medisign-logo-white.png" alt="MEDISIGN 홈" width="292" height="359">
      <span>자료실</span>
    </a>
    <a class="back" href="index.html#board">← 자료실 목록</a>
  </div>

  <main id="main">
    <p class="empty" id="loading">불러오는 중…</p>
  </main>

  <footer>
    <a href="index.html">← 메디사인 홈</a>
    <a href="mailto:medisign26@gmail.com">medisign26@gmail.com</a>
  </footer>
</div>

<script>
/* 글 내용은 data/posts.json 에서 가져옵니다.
   '의견 보내기' 주소는 posts.json 의 feedback 값입니다.
   지금은 "#"(준비 중)이고, 구글폼을 만들면 그 주소로 바꾸면 버튼이 켜집니다. */
(function(){
  var main = document.getElementById('main');
  var id = new URLSearchParams(location.search).get('id');

  /* 작은 도우미 — 모든 글자는 textContent 로만 넣습니다 */
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function block(title){
    var s = el('section', 'block');
    s.appendChild(el('h2', null, title));
    return s;
  }
  function placeholder(alt){
    var p = el('div', 'ph', '사진 준비 중');
    p.setAttribute('role', 'img');
    p.setAttribute('aria-label', (alt || '사진') + ' (사진 준비 중)');
    return p;
  }

  /* ===== 사진 갤러리: 썸네일을 누르면 큰 사진이 바뀝니다 ===== */
  function gallery(images, title){
    var wrap = el('div', 'gallery');
    var frame = el('div', 'frame');
    wrap.appendChild(frame);
    images = (images && images.length) ? images : [{ src:'', alt:title, label:'' }];

    function showBig(img){
      frame.textContent = '';
      if(!img.src){ frame.appendChild(placeholder(img.alt)); return; }
      var i = document.createElement('img');
      i.src = img.src; i.alt = img.alt || title;
      i.onerror = function(){ frame.textContent = ''; frame.appendChild(placeholder(img.alt)); };
      frame.appendChild(i);
    }
    showBig(images[0]);

    if(images.length > 1){
      var list = el('ul', 'thumbs');
      list.setAttribute('aria-label', '사진 고르기');
      images.forEach(function(img, n){
        var li = el('li');
        var b = el('button', 'thumb');
        b.type = 'button';
        b.setAttribute('aria-pressed', String(n === 0));
        b.setAttribute('aria-label', (img.label || ('사진 ' + (n+1))) + ' 크게 보기');
        var box = el('span', 't-img');
        if(img.src){
          var t = document.createElement('img'); t.src = img.src; t.alt = '';
          t.onerror = function(){ box.textContent = '준비 중'; };
          box.appendChild(t);
        } else { box.textContent = '준비 중'; }
        b.appendChild(box);
        b.appendChild(el('span', 't-label', img.label || ''));
        b.addEventListener('click', function(){
          showBig(img);
          list.querySelectorAll('.thumb').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
        });
        li.appendChild(b); list.appendChild(li);
      });
      wrap.appendChild(list);
    }
    return wrap;
  }

  /* ===== 버튼 ===== */
  function linkBtn(text, href, cls, external){
    var a = el('a', 'btn' + (cls ? ' ' + cls : ''), text);
    a.href = href;
    if(external){ a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }
  function pdfButton(path){
    var box = el('div');
    var a = linkBtn('PDF 받기 (인쇄용)', path, null, false);
    a.setAttribute('download', '');
    box.appendChild(a);
    var note = el('p', 'btn-note', 'A4로 인쇄해 쓰실 수 있습니다.');
    box.appendChild(note);
    /* 파일이 아직 없으면 버튼을 끄고 '준비 중'으로 안내합니다 */
    fetch(path, { method:'HEAD', cache:'no-cache' }).then(function(r){
      if(!r.ok) throw 0;
    }).catch(function(){
      a.textContent = 'PDF 준비 중';
      a.removeAttribute('href'); a.removeAttribute('download');
      a.setAttribute('aria-disabled', 'true');
      note.textContent = '인쇄용 파일을 정리하고 있습니다.';
    });
    return box;
  }
  function feedbackButton(url){
    var ready = url && url !== '#';
    var a = linkBtn(ready ? '의견 보내기' : '의견 보내기 (준비 중)', ready ? url : '#', 'ghost', ready);
    if(!ready){ a.setAttribute('aria-disabled', 'true'); a.removeAttribute('href'); }
    return a;
  }

  /* ===== 상세 소개 + 사진 (posts.json 의 intro, figures) ===== */
  function introBlock(p){
    var hasText = p.intro && p.intro.length, figs = p.figures || [];
    if(!hasText && !figs.length) return null;
    var s = block('소개');
    if(hasText) s.appendChild(el('p', 'intro', p.intro.join('\n')));
    figs.forEach(function(f){
      var fig = el('figure', 'fig');
      var a = el('a'); a.href = f.src; a.target = '_blank'; a.rel = 'noopener';
      var img = document.createElement('img');
      img.src = f.src; img.alt = f.alt || ''; img.loading = 'lazy';
      a.appendChild(img); fig.appendChild(a);
      if(f.caption) fig.appendChild(el('figcaption', null, f.caption));
      s.appendChild(fig);
    });
    return s;
  }

  /* ===== 머리말 (분류·제목·한 줄 소개·버전) ===== */
  function head(p){
    var h = el('header');
    h.appendChild(el('p', 'cat', p.category));
    h.appendChild(el('h1', null, p.title));
    if(p.summary) h.appendChild(el('p', 'summary', p.summary));
    var v = [p.version, p.date].filter(Boolean).join(' · ');
    if(v) h.appendChild(el('p', 'ver', v));
    return h;
  }

  /* ===== 병원 의사소통도구 화면 ===== */
  function toolView(p){
    var frag = document.createDocumentFragment();
    frag.appendChild(head(p));
    var grid = el('div', 'detail');
    grid.appendChild(gallery(p.images, p.title));

    var side = el('div');
    var ib = introBlock(p); if(ib) side.appendChild(ib);

    var act = el('section', 'block');
    var row = el('div', 'actions');
    if(p.pdf) row.appendChild(pdfButton(p.pdf));
    act.appendChild(row);
    side.appendChild(act);

    var u = p.usage || {};
    if((u.deaf && u.deaf.length) || (u.staff && u.staff.length)){
      var b = block('사용법');
      var box = el('div', 'usage');
      [['농인용', u.deaf], ['의료진용', u.staff]].forEach(function(pair){
        if(!pair[1] || !pair[1].length) return;
        var col = el('div');
        col.appendChild(el('h3', null, pair[0]));
        var ol = el('ol');
        pair[1].forEach(function(s){ ol.appendChild(el('li', null, s)); });
        col.appendChild(ol); box.appendChild(col);
      });
      b.appendChild(box); side.appendChild(b);
    }

    var pr = block('만든 과정');
    if(p.process && p.process.length){
      var tw = el('div', 'tbl-wrap');
      var t = el('table');
      var cap = el('caption', null, p.title + ' 만든 과정'); cap.hidden = true; t.appendChild(cap);
      var thead = el('thead'), hr = el('tr');
      ['단계', '시기', '한 일'].forEach(function(c){ var th = el('th', null, c); th.scope = 'col'; hr.appendChild(th); });
      thead.appendChild(hr); t.appendChild(thead);
      var tb = el('tbody');
      p.process.forEach(function(s){
        var tr = el('tr');
        tr.appendChild(el('td', null, s.step || ''));
        tr.appendChild(el('td', null, s.date || ''));
        tr.appendChild(el('td', null, s.what || ''));
        tb.appendChild(tr);
      });
      t.appendChild(tb); tw.appendChild(t); pr.appendChild(tw);
    } else {
      pr.appendChild(el('p', 'empty', '과정 기록을 정리하고 있습니다.'));
    }
    side.appendChild(pr);

    var info = block('이용 조건과 출처');
    var fine = el('div', 'fine');
    var lic = el('p');
    lic.appendChild(document.createTextNode('출처(메디사인)를 밝히면 비영리 목적으로 자유롭게 인쇄·사용 가능 ('));
    var cc = el('a', null, 'CC BY-NC 4.0');
    cc.href = 'https://creativecommons.org/licenses/by-nc/4.0/deed.ko'; cc.target = '_blank'; cc.rel = 'noopener';
    lic.appendChild(cc); lic.appendChild(document.createTextNode(')'));
    fine.appendChild(lic);
    if(p.ai){ var ai = el('p'); ai.appendChild(el('b', null, 'AI 사용 · ')); ai.appendChild(document.createTextNode(p.ai)); fine.appendChild(ai); }
    if(p.support){ var sp = el('p'); sp.appendChild(el('b', null, '지원 · ')); sp.appendChild(document.createTextNode(p.support)); fine.appendChild(sp); }
    info.appendChild(fine);
    var fb = el('div', 'actions'); fb.style.marginTop = '1.1rem';
    fb.appendChild(feedbackButton(p.feedback));
    info.appendChild(fb);
    side.appendChild(info);

    grid.appendChild(side);
    frag.appendChild(grid);
    return frag;
  }

  /* ===== 문화재단 프로젝트 화면 ===== */
  function projectView(p){
    var frag = document.createDocumentFragment();
    frag.appendChild(head(p));
    var grid = el('div', 'detail');
    grid.appendChild(gallery(p.images, p.title));

    var side = el('div');
    var ib = introBlock(p); if(ib) side.appendChild(ib);
    var f = el('section', 'block');
    f.appendChild(el('h2', null, '지원'));
    var dl = el('dl', 'facts');
    if(p.org){ dl.appendChild(el('dt', null, '지원 기관')); dl.appendChild(el('dd', null, p.org)); }
    if(p.period){ dl.appendChild(el('dt', null, '기간')); dl.appendChild(el('dd', null, p.period)); }
    f.appendChild(dl); side.appendChild(f);

    if(p.results && p.results.length){
      var r = block('성과');
      var ul = el('ul', 'results');
      p.results.forEach(function(x){ ul.appendChild(el('li', null, x)); });
      r.appendChild(ul); side.appendChild(r);
    }
    if(p.link){
      var go = el('section', 'block');
      go.appendChild(linkBtn('수어지도 보러 가기 →', p.link, 'big', true));
      go.appendChild(el('p', 'btn-note', '새 창에서 열립니다.'));
      side.appendChild(go);
    }
    grid.appendChild(side);
    frag.appendChild(grid);
    return frag;
  }

  function notFound(msg){
    main.textContent = '';
    var box = el('div', 'notfound');
    box.appendChild(el('h1', null, msg || '글을 찾을 수 없습니다.'));
    box.appendChild(el('p', 'summary', '주소가 바뀌었거나 지워진 글일 수 있습니다.'));
    var a = el('a', 'btn', '자료실 목록으로'); a.href = 'index.html#board';
    var row = el('div', 'actions'); row.style.marginTop = '1.6rem'; row.appendChild(a);
    box.appendChild(row);
    main.appendChild(box);
  }

  fetch('data/posts.json', { cache:'no-cache' })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      var p = (data.posts || []).filter(function(x){ return x.id === id; })[0];
      if(!p){ notFound(); return; }
      document.title = p.title + ' — MEDISIGN 자료실';
      main.textContent = '';
      main.appendChild(p.category === '문화재단' ? projectView(p) : toolView(p));
    })
    .catch(function(){ notFound('자료를 불러오지 못했습니다.'); });
})();
</script>
</body>
</html>
