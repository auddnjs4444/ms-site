<style>
:root{--paper:#F2F1EB;--surface:#F6F6F4;--ink:#121210;--ink-soft:#3A3A36;--muted:#706E63;
  --line:rgba(18,18,16,.14);--accent:#188144;--accent-deep:#0F6B37;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;
  line-height:1.75;letter-spacing:-.011em;word-break:keep-all;-webkit-font-smoothing:antialiased;
  min-height:100svh;display:flex;align-items:center}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(520px,90vw);margin-inline:auto;padding:3rem 0}
.mark{height:44px;width:auto;display:block;filter:invert(1);margin-bottom:2.2rem}
h1{font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:-.035em;line-height:1.14;font-weight:600}
h1 em{font-style:normal;color:var(--accent)}
p{margin-top:1rem;color:var(--ink-soft);font-size:.95rem}
.links{margin-top:2.4rem;border-top:1px solid var(--line);padding-top:1.6rem;
  display:flex;flex-direction:column;gap:.9rem}
.links a{font-weight:650;font-size:.95rem;text-decoration-color:var(--line);text-underline-offset:5px}
.links a:hover{color:var(--accent-deep);text-decoration-color:var(--accent)}
.note{margin-top:2rem;font-size:.82rem;color:var(--muted);line-height:1.7}
code{background:#e4e3dc;padding:1px 5px;border-radius:4px;font-size:.92em}
</style>
</head>
